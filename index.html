<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digit - Self-Custody Crypto Wallet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    :root {
      --bg-color: #f5f5f5;
      --text-color: #0b0b0b;
      --link-color: #007bff;
      --screen-bg: #fff;
      --nav-bg: #111;
      --glow: 0 0 10px rgba(0, 123, 255, 0.6);
      --footer-bg: #e9e9e9;
      --footer-text: #555;
    }

    body.dark {
      --bg-color: #0b0b0b;
      --text-color: #f5f5f5;
      --link-color: #4a90e2;
      --screen-bg: #1a1a1a;
      --nav-bg: #000;
      --glow: 0 0 20px rgba(74, 144, 226, 0.8);
      --footer-bg: #111;
      --footer-text: #aaa;
    }

    /* Animated gradient background */
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(-45deg, #1a1a1a, #0d0d0d, #121212, #141414);
      background-size: 400% 400%;
      color: var(--text-color);
      animation: gradientShift 15s ease infinite;
      transition: background 0.5s, color 0.5s;
    }

    body.light {
      background: linear-gradient(-45deg, #e9f2ff, #f9f9f9, #e0f7ff, #f4f4f4);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--link-color);
      text-shadow: var(--glow);
      letter-spacing: 1px;
    }

    header a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 1rem;
      transition: color 0.3s;
    }

    header a:hover {
      color: var(--link-color);
      text-shadow: var(--glow);
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 60px;
      gap: 80px;
      text-align: left;
    }

    .text-section {
      max-width: 450px;
    }

    .text-section h2 {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--text-color);
      text-shadow: var(--glow);
    }

    .text-section p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .text-section button {
      background: var(--link-color);
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 14px 30px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: var(--glow);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .text-section button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(74, 144, 226, 0.8);
    }

    /* iPhone Mockup */
    .iphone-frame {
      position: relative;
      width: 320px;
      height: 640px;
      border: 12px solid #000;
      border-radius: 40px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6), var(--glow);
      background: #000;
      overflow: hidden;
      transition: all 0.5s;
    }

    .iphone-notch {
      position: absolute;
      top: 0;
      width: 150px;
      height: 30px;
      background: #000;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .screen {
      width: 94%;
      height: 94%;
      margin: auto;
      background: var(--screen-bg);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.5s;
    }

    .view {
      flex: 1;
      padding: 20px;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.6s ease;
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .view.active {
      opacity: 1;
      transform: translateX(0);
    }

    .wallet-view h3 {
      color: #4cff9a;
      text-align: center;
    }

    .wallet-view .actions button {
      background: #4a90e2;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: white;
      margin: 5px;
      cursor: pointer;
      box-shadow: var(--glow);
      transition: transform 0.3s;
    }

    .wallet-view .actions button:hover {
      transform: scale(1.1);
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background: var(--nav-bg);
      padding: 12px 0;
      border-top: 1px solid #222;
      transition: background 0.5s;
    }

    .bottom-nav button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .bottom-nav button.active {
      color: #fff;
      text-shadow: var(--glow);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: var(--footer-bg);
      color: var(--footer-text);
      transition: background 0.5s, color 0.5s;
      font-size: 0.9rem;
    }

    footer a {
      color: var(--link-color);
      text-decoration: none;
    }

    /* Floating Theme Toggle */
    .theme-toggle {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: var(--link-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: var(--glow);
      transition: transform 0.3s, box-shadow 0.4s;
    }

    .theme-toggle:hover {
      transform: rotate(20deg) scale(1.1);
      box-shadow: 0 0 25px rgba(74, 144, 226, 0.9);
    }
  </style>
</head>

<body class="dark">
  <header>
    <h1>Digit</h1>
    <a href="#how-it-works">How it Works</a>
  </header>

  <main>
    <div class="text-section">
      <h2>Self-custody crypto wallet</h2>
      <p>Manage your assets, swap, trade, and spend crypto like cash. Connect to Web3 and dApps — all from one powerful platform.</p>
      <button id="getStarted">Get Started</button>
    </div>

    <div class="iphone-frame">
      <div class="iphone-notch"></div>
      <div class="screen">
        <div class="view wallet-view active" id="wallet">
          <h3>$12,345.67</h3>
          <div class="actions">
            <button>Spend</button>
            <button>Swap</button>
          </div>
        </div>
        <div class="view" id="settings">
          <h3>Settings</h3>
          <button id="toggleTheme">Toggle Dark Mode</button>
        </div>
        <div class="view" id="messages">
          <h3>Messages</h3>
          <p>No new notifications.</p>
        </div>
        <div class="view" id="profile">
          <h3>Profile</h3>
          <p>@digituser</p>
        </div>

        <div class="bottom-nav">
          <button class="active" data-view="wallet">Wallet</button>
          <button data-view="settings">Settings</button>
          <button data-view="messages">Messages</button>
          <button data-view="profile">Profile</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    © 2025 Digit. Powered by <a href="https://wordpress.org" target="_blank">WordPress</a>.
  </footer>

  <button class="theme-toggle" id="globalToggle">🪄</button>

  <script>
    const navButtons = document.querySelectorAll('.bottom-nav button');
    const views = document.querySelectorAll('.view');
    let activeView = document.querySelector('.view.active');
    const body = document.body;
    const toggleThemeBtn = document.getElementById('toggleTheme');
    const globalToggle = document.getElementById('globalToggle');

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.view);
        if (target === activeView) return;
        navButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeView.classList.remove('active');
        target.classList.add('active');
        activeView = target;
      });
    });

    function toggleTheme() {
      body.classList.toggle('dark');
      body.classList.toggle('light');
      globalToggle.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
    }

    toggleThemeBtn.addEventListener('click', toggleTheme);
    globalToggle.addEventListener('click', toggleTheme);

    document.getElementById('getStarted').addEventListener('click', () => {
      alert("Welcome to Digit Wallet — Explore all features directly from this landing page!");
    });
  </script>
</body>
</html>
